# Runs R CMD check across platforms and R versions. The package had no CI
# before 0.3.0, which is how a missing tests/testthat.R went unnoticed: the
# suite existed but nothing ever ran it.
name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Re-runnable without a commit. A check can fail for a reason that has
  # nothing to do with the code -- a runner outage, an upstream package
  # published broken -- and the fix is to run it again, not to push something.
  workflow_dispatch:

# Read-only. None of these jobs writes to the repository: results leave as an
# artifact or as the job's own status, both of which the runtime handles
# without a repository scope. `read-all` would also work and is what most of
# these carried; this is the narrower claim that is actually true.
permissions:
  contents: read

# One run per branch. A second push supersedes the first, and finishing a check
# of code nobody will look at again costs minutes and publishes a status for a
# commit that is no longer the tip.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
